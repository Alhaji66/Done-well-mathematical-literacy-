name: Deploy Edge Functions

# Deploys supabase/functions (the tutor and mark-paper) to the Supabase project,
# so nobody has to paste code into the dashboard editor. Runs when a function
# changes on main, or by hand from the Actions tab ("Run workflow").
#
# Needs one repository secret, SUPABASE_ACCESS_TOKEN: a personal access token
# from supabase.com/dashboard/account/tokens. The project is read from the
# SUPABASE_URL secret the site deploy already uses. The functions' own secrets
# (AI_GATEWAY_API_KEY, TUTOR_MODEL, ...) stay in Supabase: Edge Functions -> Secrets.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Check the token is set
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the functions were not deployed. Add it under Settings -> Secrets and variables -> Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      # Both functions check the caller themselves, so the gateway's JWT check is off.
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*$#\1#')
          supabase functions deploy tutor mark-paper --project-ref "$REF" --use-api --no-verify-jwt
