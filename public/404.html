<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DONE WELL®</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages only serves static files, so a direct deep link (e.g. a bookmark or
      // shared URL to /app/learner/learn) 404s here instead of reaching React Router.
      // This redirects it to index.html with the intended path encoded in the query
      // string; index.html's matching script decodes it back before the app renders.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
